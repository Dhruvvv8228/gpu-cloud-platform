version: '3.8'

services:
  postgres:
    image: postgres:18-alpine
    container_name: gpu_cloud_postgres
    environment:
      POSTGRES_USER: gpu_cloud
      POSTGRES_PASSWORD: gpu_cloud_secret
      POSTGRES_DB: gpu_cloud_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpu_cloud -d gpu_cloud_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/auto-setup:1.24.2
    container_name: gpu_cloud_temporal
    ports:
      - "7233:7233"
      - "8233:8233"
    environment:
      - DB=postgresql
      - DB_PORT=5432
      - POSTGRES_USER=gpu_cloud
      - POSTGRES_PWD=gpu_cloud_secret
      - POSTGRES_SEEDS=postgres
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: gpu_cloud_api
    ports:
      - "8080:8080"
    environment:
      - DATABASE_URL=postgres://gpu_cloud:gpu_cloud_secret@postgres:5432/gpu_cloud_db?sslmode=disable
      - PORT=8080
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    container_name: gpu_cloud_worker
    environment:
      - DATABASE_URL=postgres://gpu_cloud:gpu_cloud_secret@postgres:5432/gpu_cloud_db?sslmode=disable
      - TEMPORAL_HOST=temporal:7233
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    container_name: gpu_cloud_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:3000/api/v1
    depends_on:
      - api

volumes:
  postgres_data:
